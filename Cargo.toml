[package]
name = "playjs-rust-examples"
version = "0.1.0"
edition = "2021"
authors = ["PlayJS Contributors"]
description = "Rust/WASM examples for PlayJS browser IDE"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = ["console"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = 3
lto = true
